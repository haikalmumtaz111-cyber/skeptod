<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura Village</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
#o{position:fixed;inset:0;background:#000;transition:opacity 2.6s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}
#o i{width:10px;height:10px;border-radius:50%;background:#f6c3d3;box-shadow:0 0 18px 6px rgba(246,160,190,.55);animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.8);opacity:.4}}
#o.f i{animation:none;opacity:.2;box-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="o"><i></i></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
